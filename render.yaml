services:
  - type: web
    name: voicecall-server
    env: node
    plan: free
    buildCommand: cd server && npm ci
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: NODE_TLS_REJECT_UNAUTHORIZED
        value: "0"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: voicecall-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1