services:
  - type: web
    name: voicecall-server
    env: node
    plan: free
    buildCommand: cd server && npm ci
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TELEGRAM_BOT_TOKEN
        value: 8837390650:AAHXNH1zY7G0_aV5E8QP07roI_uyh8FyPeBY
      - key: TELEGRAM_ADMIN_CHAT_ID
        value: "8446148412"
      - key: NODE_TLS_REJECT_UNAUTHORIZED
        value: "0"
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: voicecall-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1